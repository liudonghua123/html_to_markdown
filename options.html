<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML to Markdown Options</title>
  <script src="vendor/@tailwind-browser@4.js"></script>
  <link rel="stylesheet" href="vendor/github-markdown-css.css">
  <link rel="stylesheet" href="monaco-editor/0.52.2/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">HTML to Markdown Converter</h1>
      <p class="text-gray-600">Configure the extension settings below</p>
    </div>
    
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">General Settings</h2>
      <div class="flex items-center gap-4">
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="dompurify-toggle" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
          <span class="ml-3 text-sm font-medium text-gray-700">Enable DOMPurify</span>
        </label>
        <span class="text-gray-500 text-sm">Sanitize HTML content for security</span>
      </div>
    </div>
    
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Rule Configuration</h2>
      <p class="text-gray-600 mb-4">Configure selectors for specific URLs. Use regular expressions for URLs.</p>
      
      <div class="rule-list" id="rule-list">
        <!-- Rules will be added here dynamically -->
      </div>
      
      <button id="add-rule" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">Add New Rule</button>
    </div>
    
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Custom CSS</h2>
      <p class="text-gray-600 mb-4">Add custom CSS to style the extension UI:</p>
      <div id="css-editor" class="border border-gray-300 rounded-lg overflow-hidden"></div>
    </div>
    
    <div class="bg-white rounded-xl shadow p-6">
      <div class="flex justify-end gap-3">
        <button id="reset-options" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-200">Reset to Defaults</button>
        <button id="save-options" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">Save Options</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="options.js"></script>
</body>
</html>
